; Ledger - a living economy for Skyrim SE/AE
; Changes take effect the next time the game starts.

[General]
; Key that opens the Ledger menu (DirectInput scan code). 66 = F8, 67 = F9
iMenuKey = 66
; Show market news as on-screen notifications
bNotifications = true

[Prices]
; Re-price goods by hold and category while you trade
bScalePrices = true
; 0 = vanilla prices, 1 = full effect, up to 1.5 for a harsher economy
fPriceStrength = 1.0
; How far supply and demand push prices from normal (0-2)
fPriceSwing = 1.0
; Merchants' purses grow and shrink with their hold's prosperity
bScaleMerchantGold = true
; Merchants carry more of what's plentiful and less of what's scarce
bShiftStock = true

[Investing]
; Broker's cut when buying shares (half that when selling)
fShareFee = 0.05
; Daily chance at full road danger that outlaws raid a business
fRaidChance = 0.03
; Share of profit paid as dividends (a controlling stake always pays 0.6)
fDividendShare = 0.4

[Events]
; React to Legion vs Stormcloak fighting
bCivilWar = true
; React to dragon attacks
bDragons = true
; Factions used to recognise civil-war battles (confirmed against UESP)
sImperialFaction = Skyrim.esm|0x01C9FC
sStormcloakFaction = Skyrim.esm|0x01C9FD
; Without Bloodfeud, killing these makes a hold's roads a little safer
sOutlawNames = Bandit, Forsworn, Highwayman, Marauder, Necromancer, Vampire
; Max news entries kept in the save
iNewsLimit = 300
