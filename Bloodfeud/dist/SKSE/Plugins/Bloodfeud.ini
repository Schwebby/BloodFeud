; Bloodfeud - Nemesis-style feuds and faction wars for Skyrim SE/AE
; Changes take effect the next time the game starts.

[General]
; Key that opens the Bloodfeud menu (DirectInput scan code). 65 = F7, 66 = F8, 67 = F9
iMenuKey = 65
; Show faction-war headlines as on-screen notifications
bShowRumors = true
; Give tracked enemies their generated names in-game
bRenameEnemies = true
; Apply generated strengths/weaknesses to ordinary enemies too (not just officers and nemeses)
bBuffGrunts = true
; Wounded enemies may yield and offer to talk
bInterrogation = true

[Nemesis]
; Chance a named enemy you "kill" survives and comes back scarred (0-1)
fCheatDeathChance = 0.25
; Chance a relative swears vengeance when you kill someone (0-1)
fKinVengeanceChance = 0.35
; Multiplier on how often enemies yield at low health
fYieldChanceMult = 1.0
; Hatred (0-100) at which a grudge becomes a blood-oath
iNemesisHatred = 60
; How many nemeses can hunt you at once (others wait their turn)
iMaxNemeses = 10

[Ambush]
; Base chance per in-game hour, per nemesis, that they find you outdoors
fChancePerHour = 0.06
; Minimum in-game days between ambushes
fCooldownDays = 1.0
; Max followers a nemesis brings
iMaxEscorts = 3
; How far behind you ambushers appear (game units, ~70 per metre)
fSpawnDistance = 1800
; Ambushers further than this, out of combat, are cleaned up
fDespawnDistance = 9000

[World]
; Off-screen faction wars, succession and territory
bFactionWar = true
; Small life events for people you've met (drinking, dogs, duels...)
bLifeEvents = true
; Max chronicle entries kept in the save
iChronicleLimit = 400

[Detection]
; Enemies are sorted into groups by faction first, then by these name fragments.
sBanditNames = Bandit, Highwayman, Marauder, Outlaw, Thug
sForswornNames = Forsworn, Briarheart, Ravager
sSilverHandNames = Silver Hand
sThalmorNames = Thalmor, Justiciar
sVampireNames = Vampire
sNecromancerNames = Necromancer, Conjurer, Warlock
; Name fragments that mark a dungeon boss (they become faction officers)
sBossNames = Chief, Boss, Briarheart, Master, Leader

[Factions]
; Plugin|FormID of the game factions used to detect each group. Blank = name matching only.
; Silver Hand and Necromancer IDs are confirmed against UESP; check the others in xEdit
; and correct them here if your log says a faction wasn't found.
sBandit = Skyrim.esm|0x01BCC0
sForsworn = Skyrim.esm|0x043599
sSilverHand = Skyrim.esm|0x0AA0A4
sThalmor = Skyrim.esm|0x039F26
sVampire = Skyrim.esm|0x027242
sNecromancer = Skyrim.esm|0x034B74
